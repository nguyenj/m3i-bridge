name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: vet + test (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Install libusb (for gousb cgo build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

  build:
    name: build ${{ matrix.target.label }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        target:
          # Primary Pi Zero 2 W target: Raspberry Pi OS 64-bit.
          - label: linux-arm64
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            cross_pkg: gcc-aarch64-linux-gnu
            libc_dev_pkg: libc6-dev-arm64-cross
            deb_arch: arm64
            multiarch_lib: aarch64-linux-gnu
          # Fallback: Raspberry Pi OS 32-bit (also runs on Zero 2 W).
          - label: linux-armv7
            goarch: arm
            goarm: '7'
            cc: arm-linux-gnueabihf-gcc
            cross_pkg: gcc-arm-linux-gnueabihf
            libc_dev_pkg: libc6-dev-armhf-cross
            deb_arch: armhf
            multiarch_lib: arm-linux-gnueabihf
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Pin amd64 on default mirror + add ports for ${{ matrix.target.deb_arch }}
        run: |
          set -e
          sudo dpkg --add-architecture ${{ matrix.target.deb_arch }}
          # Ubuntu's default mirror does not carry arm packages — restrict it
          # to amd64 so apt does not try to fetch the foreign arch from it.
          sudo sed -i '/^Components:/i Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/ports.sources > /dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security
          Components: main universe
          Architectures: ${{ matrix.target.deb_arch }}
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update

      - name: Install cross toolchain + libusb (${{ matrix.target.deb_arch }})
        run: |
          sudo apt-get install -y --no-install-recommends \
            ${{ matrix.target.cross_pkg }} \
            ${{ matrix.target.libc_dev_pkg }} \
            libusb-1.0-0-dev:${{ matrix.target.deb_arch }} \
            pkg-config

      - name: Build
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: ${{ matrix.target.goarch }}
          GOARM: ${{ matrix.target.goarm }}
          CC: ${{ matrix.target.cc }}
          PKG_CONFIG_PATH: /usr/lib/${{ matrix.target.multiarch_lib }}/pkgconfig
        run: |
          target="m3i-bridge-${{ matrix.target.label }}"
          mkdir -p "dist/${target}/lib"
          go build -trimpath -ldflags='-s -w' -o "dist/${target}/m3i-bridge" ./cmd/m3i-bridge
          cp -a /usr/lib/${{ matrix.target.multiarch_lib }}/libusb-1.0.so.0* "dist/${target}/lib/"
          cp \
            deploy/m3i-bridge.service \
            deploy/99-coospo-ant.rules \
            deploy/install.sh \
            deploy/m3i-bridge-firstboot.sh \
            deploy/m3i-bridge-preflight.sh \
            deploy/m3i-bridge-diagnostics.sh \
            deploy/m3i-bridge-diagnostics.service \
            deploy/prepare-bootfs.sh \
            deploy/raspberry-pi.md \
            "dist/${target}/"
          file "dist/${target}/m3i-bridge"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3i-bridge-${{ matrix.target.label }}
          path: dist/m3i-bridge-${{ matrix.target.label }}/
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package tarballs
        run: |
          set -euo pipefail
          mkdir -p release
          for d in dist/m3i-bridge-*; do
            target=$(basename "$d")
            cp \
              deploy/m3i-bridge.service \
              deploy/99-coospo-ant.rules \
              deploy/install.sh \
              deploy/m3i-bridge-firstboot.sh \
              deploy/m3i-bridge-preflight.sh \
              deploy/m3i-bridge-diagnostics.sh \
              deploy/m3i-bridge-diagnostics.service \
              deploy/prepare-bootfs.sh \
              deploy/raspberry-pi.md \
              "$d/"
            tar -C dist -czf "release/${target}.tar.gz" "$target"
          done
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
